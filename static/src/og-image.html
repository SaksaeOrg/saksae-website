<!doctype html>
<!--
  Modèle des aperçus sociaux — assets/og-image-<code>.png, un par langue.

  Ce fichier n'est pas publié : deploy.mjs ne copie que index.html, robots.txt,
  sitemap.xml, CNAME, css/, js/ et assets/.

  Les marqueurs {{...}} sont remplis par src/build-og.mjs, qui rend ensuite la
  page en 1200x630. Le texte reprend volontairement le titre de la page
  correspondante : un aperçu qui promet autre chose que la page nuit au taux
  de clic.

  Pour régénérer :  node src/build-og.mjs
-->
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../assets/inter-latin.woff2') format('woff2');
        font-weight: 400 700;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../assets/inter-vietnamese.woff2') format('woff2');
        font-weight: 400 700;
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1,
          U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Noto Sans Thai';
        src: url('../assets/noto-sans-thai.woff2') format('woff2');
        font-weight: 400 700;
      }
    </style>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #fafafa;
        font-family: {{FONT_STACK}};
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow: hidden;
      }

      /* Même trame pointillée que la section héros */
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(0, 0, 0, 0.05) 0.75px, transparent 0.75px);
        background-size: 28px 28px;
        opacity: 0.6;
      }

      .fade {
        position: absolute;
        inset: auto 0 0 0;
        height: 160px;
        background: linear-gradient(to top, #fafafa, transparent);
      }

      .frame {
        position: relative;
        height: 100%;
        padding: 72px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Le logo est recadré sur son contenu réel : le fichier source garde
         68 % de vide autour du mark. */
      .logo {
        height: 56px;
        width: auto;
        display: block;
        /* sans cela l'élément flex s'étire et le SVG se recentre */
        align-self: flex-start;
      }

      h1 {
        margin: 0;
        font-size: 78px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.035em;
        color: #0a0a0a;
      }

      h1 .muted,
      h1 .text-\[\#A1A1AA\] {
        color: #a1a1aa;
      }

      /* Le thaï empile ses diacritiques : interligne desserrée, crénage neutre. */
      html[lang='th'] h1 {
        font-size: 64px;
        line-height: 1.32;
        letter-spacing: normal;
      }

      html[lang='th'] .tag,
      html[lang='th'] .foot {
        letter-spacing: normal;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #295cf0;
        margin-bottom: 28px;
      }

      .tag::before {
        content: '';
        width: 32px;
        height: 2px;
        background: #295cf0;
        border-radius: 1px;
      }

      .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 48px;
        font-size: 22px;
        color: #52525b;
        letter-spacing: -0.01em;
      }

      /* Les langues verbeuses ne doivent pas venir buter sur le domaine. */
      .foot > span:first-child {
        min-width: 0;
      }

      .domain {
        font-weight: 500;
        color: #0a0a0a;
        flex-shrink: 0;
      }
    </style>
  </head>
